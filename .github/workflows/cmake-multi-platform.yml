name: Minecraft Launcher build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  mac-intel-build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Project
        run: |
          cmake -B build
          cmake --build build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libLRC_macOS-Intel
          path: |
            build/libLRC.dylib

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install And Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure Project
        run: |
          cmake -B build -G Ninja -DCMAKE_PREFIX_PATH=/mingw64

      - name: Build Project
        run: cmake --build build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libLRC_Windows-x86_64
          path: |
            build/libLRC.dll

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y pkg-config ninja-build

      - name: Build app
        working-directory: ${{ github.workspace }}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -j $(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libLRC_Linux-x86_64
          path: build/libLRC.so
